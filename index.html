
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tim's Birthday — Private Invitation</title>

<style>
:root {
  color-scheme: dark;
  --gold: #d8b77e;
  --cream: #f5e6cb;
  --muted: #c4b7c4;
  --bg: #09070c;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--cream);
  font-family: Georgia, "Noto Serif TC", serif;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

/* =========================
   MAIN SCREEN
========================= */

.screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(
      ellipse 80% 58% at 50% 42%,
      #392b35 0%,
      #17121d 55%,
      #08070c 100%
    );
}

.screen::before {
  content: "";
  position: absolute;
  inset: -30%;
  background:
    conic-gradient(
      from 15deg at 50% 45%,
      transparent 0deg,
      #c5a27b0d 35deg,
      transparent 75deg,
      #d6b57c0e 135deg,
      transparent 185deg,
      #ac8d630b 255deg,
      transparent 315deg
    );
  animation: ambient 24s linear infinite;
  pointer-events: none;
}

.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .17;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.23'/%3E%3C/svg%3E");
}

.frame {
  position: absolute;
  inset: 20px;
  border: 1px solid #a98b574d;
  pointer-events: none;
}

.frame::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid #a98b5725;
}

.micro {
  font: 10px Arial, sans-serif;
  letter-spacing: 2px;
  color: #c4a577;
}

.gold {
  color: var(--gold);
}

.rule {
  width: 65%;
  height: 1px;
  margin: 19px auto;
  background:
    linear-gradient(
      90deg,
      transparent,
      #b59462,
      transparent
    );
}

.heading {
  font-size: clamp(24px, 7vw, 34px);
  font-weight: 400;
  margin: 12px 0;
}

.desc {
  font-size: 13px;
  line-height: 1.9;
  color: var(--muted);
}

/* =========================
   INTRO
========================= */

.intro {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  transition:
    opacity .8s ease,
    visibility .8s ease;
}

.intro.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-top {
  position: absolute;
  top: clamp(43px, 9vh, 85px);
}

.intro-top::after {
  content: "✦";
  display: block;
  color: #c5a574;
  margin-top: 23px;
  font-size: 12px;
}

.stage {
  position: relative;
  width: min(100%, 480px);
  height: 390px;
  perspective: 1400px;
}

.spotlight {
  position: absolute;
  width: 400px;
  height: 480px;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%) scale(.5);
  opacity: 0;
  background:
    radial-gradient(
      ellipse,
      #f5d8a326,
      #bd8b6020 28%,
      transparent 67%
    );
  filter: blur(9px);
  pointer-events: none;
}

.ring {
  position: absolute;
  width: 245px;
  height: 245px;
  left: 50%;
  top: 52%;
  border-radius: 50%;
  border: 1px solid #d9b87b6b;
  box-shadow:
    0 0 30px #e7bc7733,
    inset 0 0 40px #e7bc771b;
  transform: translate(-50%, -50%) scale(.4);
  opacity: 0;
  pointer-events: none;
}

.envelope {
  position: absolute;
  width: 274px;
  height: 174px;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -50%) rotate(-2deg);
  transform-style: preserve-3d;
  filter: drop-shadow(0 24px 23px #000b);
  cursor: pointer;
}

.envelope-back {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(135deg, #382a34, #17121c);
  border: 1px solid #ad8c60;
}

.letter {
  position: absolute;
  left: 19px;
  bottom: 12px;
  width: 236px;
  height: 160px;
  z-index: 2;
  background:
    linear-gradient(
      145deg,
      #382b37,
      #141019 72%
    );
  border: 1px solid #e0be87;
  box-shadow:
    inset 0 0 0 6px #1b151e,
    inset 0 0 0 7px #8d704b;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 15px;
}

.letter-small {
  font: 9px Arial, sans-serif;
  letter-spacing: 2.2px;
  color: #d9b780;
}

.letter-name {
  font-size: 27px;
  font-style: italic;
  white-space: nowrap;
}

.letter-rule {
  width: 48%;
  height: 1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #bc9562,
      transparent
    );
}

.envelope-front {
  position: absolute;
  inset: 0;
  z-index: 3;
  background:
    linear-gradient(
      150deg,
      #53404c,
      #221923 60%,
      #18121d
    );
  clip-path:
    polygon(
      0 0,
      50% 62%,
      100% 0,
      100% 100%,
      0 100%
    );
  pointer-events: none;
}

.foldlines {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

.foldlines svg {
  width: 100%;
  height: 100%;
}

.flap {
  position: absolute;
  inset: 0;
  z-index: 6;
  transform-origin: 50% 0%;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  pointer-events: none;
}

.flap::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      150deg,
      #614b58,
      #29202c
    );
  clip-path:
    polygon(
      0 0,
      100% 0,
      50% 62%
    );
  border-top: 1px solid #bc9c6d;
}

.seal {
  position: absolute;
  left: 112px;
  top: 79px;
  width: 50px;
  height: 50px;
  z-index: 8;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 29px;
  color: #513214;
  background:
    radial-gradient(
      circle at 32% 22%,
      #ffefc7,
      #c79f65 47%,
      #82552e 82%
    );
  box-shadow:
    inset 0 0 0 3px #88633b,
    inset 0 0 0 5px #f1d39b,
    0 0 0 6px #715333,
    0 0 24px #edc47c55;
  pointer-events: none;
}

.seal::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 1px solid #ebc48965;
  animation: pulse 2.7s ease-in-out infinite;
}

.fracture {
  position: absolute;
  inset: 0;
  z-index: 9;
  opacity: 0;
  pointer-events: none;
}

.fracture svg {
  width: 100%;
  height: 100%;
}

.shimmer {
  position: absolute;
  inset: -3px;
  z-index: 10;
  pointer-events: none;
  background:
    linear-gradient(
      110deg,
      transparent 37%,
      #fff1c988 49%,
      transparent 61%
    );
  background-size: 260% 100%;
  opacity: 0;
}

.dust {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 15;
}

.dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 3px;
  height: 3px;
  background: #f9e4b6;
  border-radius: 50%;
  box-shadow: 0 0 8px #f6d99d;
  opacity: 0;
}

.intro-copy {
  position: absolute;
  bottom: clamp(65px, 12vh, 118px);
  left: 20px;
  right: 20px;
  text-align: center;
  transition: opacity .5s;
}

.intro-copy h1 {
  font-weight: 400;
  font-size: clamp(24px, 7vw, 30px);
  letter-spacing: 2px;
  margin: 0 0 18px;
}

.intro-copy p {
  margin: 0 0 26px;
  font: 9px Arial, sans-serif;
  letter-spacing: 2.2px;
  color: #c7a87b;
}

.cta {
  border: 1px solid #c7a370;
  background: #241a24b8;
  color: #f5dfbc;
  letter-spacing: 2px;
  font: 11px Arial, sans-serif;
  padding: 15px 25px;
  min-height: 46px;
}

.cta:active {
  background: #483341;
}

.skip {
  position: absolute;
  right: 30px;
  top: 31px;
  z-index: 30;
  background: none;
  border: 0;
  color: #d7b77e;
  font: 10px Arial, sans-serif;
  letter-spacing: 1px;
  opacity: 0;
  pointer-events: none;
}

.intro.playing .skip {
  opacity: 1;
  pointer-events: auto;
}

.intro.playing .seal {
  animation: sealBreak .6s ease .45s forwards;
}

.intro.playing .fracture {
  animation: crack .45s ease .35s forwards;
}

.intro.playing .shimmer {
  animation: glint .9s ease .08s forwards;
}

.intro.playing .flap {
  animation:
    openFlap 1.2s cubic-bezier(.16,.7,.2,1)
    1.05s forwards;
}

.intro.playing .letter {
  animation:
    liftCard 2.05s cubic-bezier(.17,.72,.18,1)
    1.75s forwards;
}

.intro.playing .envelope {
  animation: envMove 3.7s ease forwards;
}

.intro.playing .ring {
  animation: ringOut 2.2s ease .5s forwards;
}

.intro.playing .spotlight {
  animation: lightOn 3s ease 1.3s forwards;
}

.intro.playing .dot {
  animation:
    spark var(--duration) ease-out
    var(--delay) forwards;
}

.intro.playing .intro-copy {
  opacity: 0;
  pointer-events: none;
}

/* =========================
   BOOK
========================= */

.book-app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  min-height: 480px;
  margin: auto;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity .8s ease,
    visibility .8s ease;
}

.book-app.visible {
  opacity: 1;
  visibility: visible;
}

.book {
  position: absolute;
  inset:
    clamp(12px, 3vh, 25px)
    16px
    88px;
  perspective: 1800px;
  transform-style: preserve-3d;
}

.sheet {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition:
    transform .95s cubic-bezier(.22,.65,.2,1);
  border-radius: 3px 9px 9px 3px;
}

.sheet.turned {
  transform: rotateY(-180deg);
}

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 1px solid #ac8e60;
  background:
    linear-gradient(
      100deg,
      #151019,
      #2b212d 54%,
      #0c0a12
    );
  box-shadow:
    inset 9px 0 22px #0008,
    4px 9px 20px #0005;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 32px 22px;
  overflow: hidden;
}

.face::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid #604d39;
  pointer-events: none;
}

.face.back {
  transform: rotateY(180deg);
  background:
    linear-gradient(
      260deg,
      #151019,
      #29202b 55%,
      #0c0a12
    );
}

.face-content {
  position: relative;
  z-index: 1;
  width: 100%;
}

.nav {
  position: absolute;
  bottom: 5px;
  left: 0;
  right: 0;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: #0b0a10;
  z-index: 30;
}

.nav button {
  border: 1px solid #8c714e;
  background: transparent;
  color: #e2c69c;
  padding: 11px 14px;
  min-width: 77px;
  white-space: nowrap;
  font: 11px Arial, sans-serif;
}

.nav button:disabled {
  opacity: .3;
  cursor: default;
}

.nav .micro {
  min-width: 57px;
  text-align: center;
  white-space: nowrap;
}

/* =========================
   GUEST PAGES
========================= */

.guestface {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding:
    clamp(14px, 3vh, 27px)
    15px
    13px;
  min-height: 0;
}

.guestface > .micro {
  flex: 0 0 auto;
}

.guestface > .heading {
  flex: 0 0 auto;
  margin: 7px 0 3px;
  font-size: clamp(20px, 5vw, 27px);
}

.guestface > .desc {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 1.5;
}

.guestgrid {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  grid-template-rows:
    repeat(2, minmax(0, 1fr));
  gap: clamp(8px, 1.4vh, 13px);
  width: 100%;
  margin: clamp(12px, 2vh, 20px) 0 8px;
}

.guest {
  position: relative;
  display: block;
  min-width: 0;
  min-height: 0;
  perspective: 900px;
  cursor: pointer;
  isolation: isolate;
}

.guest-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition:
    transform .72s cubic-bezier(.2,.7,.2,1);
}

.guest.flipped .guest-inner {
  transform: rotateY(180deg);
}

.guest-side {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: 5px;
  background: #211b25;
  border: 1px solid #856c4c;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.guest-front .portrait {
  position: relative;
  flex: 1 1 auto;
  min-height: 40px;
  width: 100%;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% 30%,
      #4c3c53,
      #17131c 70%
    );
}

.guest:nth-child(even) .portrait {
  background:
    radial-gradient(
      circle at 50% 30%,
      #37435a,
      #171821 70%
    );
}

.guestphoto {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  z-index: 3;
}

.silhouette-holder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.sil {
  height: 100%;
  width: 100%;
  max-width: 140px;
}

.ginfo {
  flex: 0 0 auto;
  padding: 8px 4px 6px;
  text-align: left;
}

.gnum {
  font: 9px Arial, sans-serif;
  letter-spacing: 1px;
  color: #c7a777;
}

.hint {
  font-size: clamp(10px, 2.8vw, 12px);
  line-height: 1.4;
  margin-top: 5px;
}

.tap {
  font: 9px Arial, sans-serif;
  letter-spacing: .6px;
  color: #bfa175;
  margin-top: 6px;
}

/* Guest card back */

.guest-back {
  transform: rotateY(180deg);
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 12px 9px;
  background:
    radial-gradient(
      ellipse at 50% 35%,
      #3b2d3a,
      #17121b 80%
    );
  border: 1px solid #a88a5f;
}

.back-deco {
  color: #d9b77e;
  font-size: 20px;
  margin-bottom: 7px;
}

.back-title {
  font-size: clamp(13px, 3.8vw, 18px);
  margin-top: 8px;
  color: #f2dfbd;
  letter-spacing: 2px;
}

.back-rule {
  width: 55%;
  height: 1px;
  margin: 9px 0;
  background:
    linear-gradient(
      90deg,
      transparent,
      #c4a06a,
      transparent
    );
}

.back-clue {
  font-size: clamp(10px, 2.8vw, 13px);
  line-height: 1.65;
  color: #e8d6bb;
  overflow-wrap: anywhere;
}

.back-tap {
  font: 9px Arial, sans-serif;
  letter-spacing: .5px;
  color: #c5a16f;
  margin-top: 12px;
}

/* =========================
   EXPERIENCE PAGE
========================= */

.experience {
  width: 100%;
  max-width: 280px;
  display: flex;
  flex-direction: column;
  gap: 23px;
  margin: 26px auto;
}

.experience-item {
  display: flex;
  align-items: center;
  text-align: left;
  gap: 17px;
}

.symbol {
  font-size: 27px;
  color: #d5b580;
  min-width: 35px;
}

.experience-title {
  font-size: 17px;
}

.experience-sub {
  font: 9px Arial, sans-serif;
  letter-spacing: 1.6px;
  color: #bba079;
  margin-top: 6px;
}

/* =========================
   VIP PASS
========================= */

.vip {
  border: 1px solid #b99b6a;
  padding: 7px;
  width: 100%;
  max-width: 290px;
  background: #1c1720;
  transform: rotate(-2deg);
  cursor: pointer;
  margin: 28px auto;
}

.vipin {
  border: 1px solid #68543b;
  min-height: 190px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-direction: column;
  padding: 22px 12px;
  gap: 12px;
}

.vip-number {
  font-size: 52px;
}

.vip.flipped {
  transform: rotate(2deg);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes ambient {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% {
    transform: scale(1.18);
    opacity: .25;
  }
}

@keyframes glint {
  0% {
    opacity: 0;
    background-position: 100% 0;
  }
  35% { opacity: 1; }
  100% {
    opacity: 0;
    background-position: 0 0;
  }
}

@keyframes crack {
  0% { opacity: 0; }
  45% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes sealBreak {
  0% {
    opacity: 1;
    transform: scale(1);
  }
  35% {
    transform: scale(1.2);
    filter: brightness(1.5);
  }
  100% {
    opacity: 0;
    transform: scale(1.7) rotate(35deg);
  }
}

@keyframes openFlap {
  0% {
    transform: rotateX(0);
    z-index: 6;
  }
  99% { z-index: 6; }
  100% {
    transform: rotateX(180deg);
    z-index: 1;
  }
}

@keyframes liftCard {
  0% {
    transform: translateY(0) scale(1);
  }
  55% {
    transform: translateY(-145px) scale(1.03);
  }
  100% {
    transform: translateY(-167px) scale(1.14);
    box-shadow:
      inset 0 0 0 6px #1b151e,
      inset 0 0 0 7px #8d704b,
      0 0 45px #e3bd7e66;
  }
}

@keyframes envMove {
  0%, 55% {
    transform:
      translate(-50%, -50%) rotate(-2deg);
  }
  100% {
    transform:
      translate(-50%, -50%) rotate(0deg)
      scale(.98);
  }
}

@keyframes ringOut {
  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%) scale(.4);
  }
  25% { opacity: 1; }
  100% {
    opacity: 0;
    transform:
      translate(-50%, -50%) scale(2.1);
  }
}

@keyframes lightOn {
  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%) scale(.5);
  }
  35% {
    opacity: 1;
    transform:
      translate(-50%, -50%) scale(1);
  }
  100% {
    opacity: .45;
    transform:
      translate(-50%, -50%) scale(1.3);
  }
}

@keyframes spark {
  0% {
    opacity: 0;
    transform: translate(0, 0) scale(.4);
  }
  18% { opacity: 1; }
  80% { opacity: .7; }
  100% {
    opacity: 0;
    transform:
      translate(var(--x), var(--y))
      scale(.2);
  }
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-height: 700px) {
  .guestface {
    padding: 14px 12px 10px;
  }

  .guestgrid {
    gap: 7px;
    margin: 8px 0 5px;
  }

  .ginfo {
    padding: 5px 3px 3px;
  }

  .tap {
    margin-top: 3px;
  }

  .back-deco {
    margin-bottom: 4px;
  }

  .back-title {
    margin-top: 5px;
  }

  .back-rule {
    margin: 6px 0;
  }

  .back-tap {
    margin-top: 7px;
  }
}

@media (max-height: 650px) {
  .stage {
    height: 320px;
    transform: translateY(-22px);
  }

  .intro-top {
    top: 35px;
  }

  .intro-copy {
    bottom: 48px;
  }

  .intro-copy h1 {
    font-size: 23px;
  }

/* =========================================

const book = document.getElementById("book");

book.innerHTML = front.map((content, i) => {

  const isGuestPage = i === 1 || i === 2;

  return `
    <div class="sheet">

      <section
        class="face ${isGuestPage ? "guestface" : ""}">

        ${content}

      </section>

  `;

/* =========================================
   09. 翻書控制
========================================= */

const sheets = [
  ...book.querySelectorAll(".sheet")
];

const prev = document.getElementById("prev");
const next = document.getElementById("next");
const counter = document.getElementById("counter");

let page = 0;
let busy = false;
let pageTimer = null;

function render() {

  sheets.forEach((sheet, i) => {

    const turned = i < page;

    sheet.classList.toggle("turned", turned);

    sheet.style.zIndex = turned
      ? i + 1
      : sheets.length - i;

  });

  prev.disabled = page === 0;

  next.textContent =
    page === 4 ? "REOPEN ↻" : "NEXT ›";

  counter.textContent =
    String(page + 1).padStart(2, "0") +
    " / 05";
}

function flip(delta) {

  if (busy) return;

  const target = page + delta;

  if (target < 0 || target > 4) return;

  page = target;
  render();

  busy = true;

  clearTimeout(pageTimer);

  pageTimer = setTimeout(() => {
    busy = false;
  }, 980);
}

prev.addEventListener("click", () => {
  flip(-1);
});

next.addEventListener("click", () => {

  if (busy) return;

  if (page === 4) {
    restart();
    return;
  }

  flip(1);

});

render();


/* =========================================
   10. 神秘嘉賓卡片翻面

book.querySelectorAll(".guest").forEach(card => {

  function toggleGuest() {

    const flipped =
      card.classList.toggle("flipped");

    card.setAttribute(
      "aria-pressed",
      String(flipped)
    );

    card.setAttribute(
      "aria-label",
      flipped
        ? "點擊翻回嘉賓照片"
        : "點擊翻面查看神秘口頭禪"
    );

  }

  card.addEventListener("click", toggleGuest);

  card.addEventListener("keydown", event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {
      event.preventDefault();
      toggleGuest();
    }

  });

});

let vipFlipped = false;

function toggleVip() {

  vipFlipped = !vipFlipped;

  vip.classList.toggle(
    "flipped",
    vipFlipped
  );

  vipin.innerHTML =
    vipFlipped ? vipBack : vipOriginal;

}

vip.addEventListener("click", toggleVip);

});


/* =========================================
   12. 手機左右滑動翻頁
========================================= */

let touchX = null;
let touchY = null;

book.addEventListener(
  "touchstart",
  event => {

    touchX = event.touches[0].clientX;
    touchY = event.touches[0].clientY;

  },
  { passive: true }
);

book.addEventListener(
  "touchend",
  event => {

    if (touchX === null) return;

    const dx =
      event.changedTouches[0].clientX -
      touchX;

    const dy =
      event.changedTouches[0].clientY -
      touchY;

    touchX = null;
    touchY = null;

    if (
      Math.abs(dx) > 75 &&
      Math.abs(dx) > Math.abs(dy) * 1.3 &&
      !event.target.closest(".guest, .vip, button")
    ) {

      flip(dx < 0 ? 1 : -1);

    }

  },
  { passive: true }
);


/* =========================================
   13. 信封動畫與開場控制
========================================= */

const intro = document.getElementById("intro");
const bookApp = document.getElementById("bookApp");
const envelope = document.getElementById("envelope");
const openButton = document.getElementById("open");
const skipButton = document.getElementById("skip");
const dust = document.getElementById("dust");

let introState = "ready";
let introTimer = null;

/* 產生金色粒子 */

for (let i = 0; i < 48; i++) {

  const particle = document.createElement("i");

  particle.className = "dot";

  const angle = i * 2.399963;
  const distance = 65 + (i % 9) * 20;

  particle.style.setProperty(
    "--x",
    Math.cos(angle) * distance + "px"
  );

  particle.style.setProperty(
    "--y",
    Math.sin(angle) * distance + "px"
  );

  particle.style.setProperty(
    "--duration",
    (1.7 + (i % 5) * .23) + "s"
  );

  particle.style.setProperty(
    "--delay",
    (.5 + (i % 7) * .2) + "s"
  );

  dust.appendChild(particle);
}

/* 動畫完成 */

function finishIntro() {

  clearTimeout(introTimer);

  introState = "complete";

  bookApp.classList.add("visible");
  intro.classList.add("hidden");

}

/* 開啟信封 */

function openIntro() {

  if (introState !== "ready") return;

  introState = "playing";

  intro.classList.add("playing");

  introTimer = setTimeout(
    finishIntro,
    4250
  );

}

openButton.addEventListener(
  "click",
  openIntro
);

envelope.addEventListener(
  "click",
  openIntro
);

envelope.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {
      event.preventDefault();
      openIntro();
    }

  }
);

skipButton.addEventListener(
  "click",
  finishIntro
);


/* =========================================
   14. 重新開啟邀請函

   修正：
   - 重設頁碼
   - 重設卡片翻面
   - 重設 VIP
   - 重設信封動畫
========================================= */

function restart() {

  clearTimeout(pageTimer);
  clearTimeout(introTimer);

  busy = false;
  page = 0;

  /* 暫時關閉翻頁動畫 */

  sheets.forEach(sheet => {
    sheet.style.transition = "none";
  });

  render();

  /* 重設嘉賓卡片 */

  book.querySelectorAll(".guest").forEach(card => {

    card.classList.remove("flipped");

    card.setAttribute(
      "aria-pressed",
      "false"
    );

    card.setAttribute(
      "aria-label",
      "點擊翻面查看神秘口頭禪"
    );

  });

  /* 重設 VIP */

  vipFlipped = false;
  vip.classList.remove("flipped");
  vipin.innerHTML = vipOriginal;

  /* 返回信封畫面 */

  introState = "ready";

  intro.classList.remove(
    "hidden",
    "playing"
  );

  bookApp.classList.remove("visible");

  /* 重新啟用翻頁動畫 */

  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      sheets.forEach(sheet => {
        sheet.style.transition = "";
      });

    });

  });

}

</script>
